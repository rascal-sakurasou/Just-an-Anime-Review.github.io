name: Generate Sitemap

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - "sitemap.xml"
      - "sitemap-pages.xml"
      - "sitemap-anime-*.xml"

permissions:
  contents: write

concurrency:
  group: animecia-sitemap
  cancel-in-progress: true

jobs:
  sitemap:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # Checkout
      # =====================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =====================================================
      # Generate sitemap
      # =====================================================

      - name: Generate sitemap
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

        run: |
          python3 - <<'PY'

          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path


          # =================================================
          # Configuration
          # =================================================

          SUPABASE_URL = os.environ.get(
              "SUPABASE_URL",
              ""
          ).rstrip("/")

          SUPABASE_KEY = os.environ.get(
              "SUPABASE_KEY",
              ""
          )

          BASE_URL = (
              "https://media-mania.github.io/Animecia"
          )

          PAGE_SIZE = 1000

          SITEMAP_URL_LIMIT = 50000

          XML_NAMESPACE = (
              "http://www.sitemaps.org/schemas/"
              "sitemap/0.9"
          )


          # =================================================
          # Validation
          # =================================================

          if not SUPABASE_URL:
              raise RuntimeError(
                  "SUPABASE_URL is not configured."
              )

          if not SUPABASE_KEY:
              raise RuntimeError(
                  "SUPABASE_KEY is not configured."
              )


          # =================================================
          # XML namespace
          # =================================================

          ET.register_namespace(
              "",
              XML_NAMESPACE
          )


          # =================================================
          # Supabase REST request
          # =================================================

          def fetch_json(url):

              request = urllib.request.Request(
                  url,
                  method="GET",
                  headers={
                      "apikey": SUPABASE_KEY,
                      "Authorization": (
                          f"Bearer {SUPABASE_KEY}"
                      ),
                      "Accept": "application/json"
                  }
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=60
                  ) as response:

                      body = response.read().decode(
                          "utf-8"
                      )

                      return json.loads(body)

              except urllib.error.HTTPError as error:

                  error_body = error.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print(
                      "Supabase HTTP error"
                  )

                  print(
                      f"Status: {error.code}"
                  )

                  print(
                      f"Response: {error_body}"
                  )

                  raise

              except urllib.error.URLError as error:

                  print(
                      "Supabase connection error"
                  )

                  print(
                      error
                  )

                  raise


          # =================================================
          # Fetch anime
          # =================================================

          anime_records = []

          offset = 0

          while True:

              params = urllib.parse.urlencode({
                  "select": "id,updated_at",
                  "order": "id.asc",
                  "limit": str(PAGE_SIZE),
                  "offset": str(offset)
              })

              api_url = (
                  f"{SUPABASE_URL}/rest/v1/anime?"
                  f"{params}"
              )

              print(
                  f"Fetching anime records: "
                  f"offset={offset}"
              )

              page = fetch_json(
                  api_url
              )

              if not isinstance(page, list):

                  raise RuntimeError(
                      "Unexpected Supabase response."
                  )

              if not page:
                  break

              anime_records.extend(
                  page
              )

              print(
                  f"Fetched {len(page)} records "
                  f"(total: {len(anime_records)})"
              )

              if len(page) < PAGE_SIZE:
                  break

              offset += PAGE_SIZE


          # =================================================
          # Remove invalid and duplicate IDs
          # =================================================

          anime_map = {}

          for anime in anime_records:

              anime_id = anime.get("id")

              if anime_id is None:
                  continue

              anime_map[
                  str(anime_id)
              ] = anime


          anime_records = list(
              anime_map.values()
          )


          anime_records.sort(
              key=lambda item: int(
                  item["id"]
              )
          )


          print(
              f"Total unique anime: "
              f"{len(anime_records)}"
          )


          # =================================================
          # XML helpers
          # =================================================

          def create_urlset():

              return ET.Element(
                  f"{{{XML_NAMESPACE}}}urlset"
              )


          def create_sitemap_index():

              return ET.Element(
                  f"{{{XML_NAMESPACE}}}sitemapindex"
              )


          def add_url(
              urlset,
              loc,
              lastmod=None
          ):

              url_element = ET.SubElement(
                  urlset,
                  f"{{{XML_NAMESPACE}}}url"
              )

              loc_element = ET.SubElement(
                  url_element,
                  f"{{{XML_NAMESPACE}}}loc"
              )

              loc_element.text = loc

              if lastmod:

                  lastmod_text = str(
                      lastmod
                  )

                  if "T" in lastmod_text:

                      lastmod_text = (
                          lastmod_text
                          .split("T")[0]
                      )

                  else:

                      lastmod_text = (
                          lastmod_text[:10]
                      )

                  if len(lastmod_text) == 10:

                      lastmod_element = ET.SubElement(
                          url_element,
                          f"{{{XML_NAMESPACE}}}lastmod"
                      )

                      lastmod_element.text = (
                          lastmod_text
                      )


          def add_sitemap(
              sitemap_index,
              loc
          ):

              sitemap_element = ET.SubElement(
                  sitemap_index,
                  f"{{{XML_NAMESPACE}}}sitemap"
              )

              loc_element = ET.SubElement(
                  sitemap_element,
                  f"{{{XML_NAMESPACE}}}loc"
              )

              loc_element.text = loc


          def write_xml(
              root,
              filename
          ):

              tree = ET.ElementTree(
                  root
              )

              try:

                  ET.indent(
                      tree,
                      space="  "
                  )

              except AttributeError:

                  pass

              tree.write(
                  filename,
                  encoding="utf-8",
                  xml_declaration=True
              )


          # =================================================
          # Remove old anime sitemap files
          # =================================================

          for file_path in Path(".").glob(
              "sitemap-anime-*.xml"
          ):

              print(
                  f"Removing old sitemap: "
                  f"{file_path}"
              )

              file_path.unlink()


          # =================================================
          # Static pages
          # =================================================

          static_pages = [

              f"{BASE_URL}/",

              f"{BASE_URL}/anime.html",

              f"{BASE_URL}/terms.html",

              f"{BASE_URL}/privacy.html"

          ]


          # =================================================
          # Generate static page sitemap
          # =================================================

          pages_urlset = create_urlset()


          for page_url in static_pages:

              add_url(
                  pages_urlset,
                  page_url
              )


          write_xml(
              pages_urlset,
              "sitemap-pages.xml"
          )


          print(
              "Generated sitemap-pages.xml"
          )


          # =================================================
          # Generate anime sitemaps
          # =================================================

          anime_sitemap_files = []


          total_anime = len(
              anime_records
          )


          for start in range(
              0,
              total_anime,
              SITEMAP_URL_LIMIT
          ):

              chunk = anime_records[
                  start:
                  start + SITEMAP_URL_LIMIT
              ]

              sitemap_number = (
                  len(anime_sitemap_files)
                  + 1
              )

              filename = (
                  f"sitemap-anime-"
                  f"{sitemap_number}.xml"
              )

              urlset = create_urlset()


              for anime in chunk:

                  anime_id = anime.get(
                      "id"
                  )

                  if anime_id is None:
                      continue

                  encoded_id = urllib.parse.quote(
                      str(anime_id),
                      safe=""
                  )

                  detail_url = (
                      f"{BASE_URL}/"
                      f"anime-detail.html"
                      f"?id={encoded_id}"
                  )

                  add_url(
                      urlset,
                      detail_url,
                      anime.get(
                          "updated_at"
                      )
                  )


              write_xml(
                  urlset,
                  filename
              )


              anime_sitemap_files.append(
                  filename
              )


              print(
                  f"Generated {filename}: "
                  f"{len(chunk)} URLs"
              )


          # =================================================
          # Generate main sitemap index
          # =================================================

          sitemap_index = create_sitemap_index()


          # Static pages

          add_sitemap(
              sitemap_index,
              f"{BASE_URL}/sitemap-pages.xml"
          )


          # Anime pages

          for filename in anime_sitemap_files:

              add_sitemap(
                  sitemap_index,
                  f"{BASE_URL}/{filename}"
              )


          # Write main sitemap

          write_xml(
              sitemap_index,
              "sitemap.xml"
          )


          # =================================================
          # Summary
          # =================================================

          print("")
          print(
              "======================================"
          )
          print(
              "Animecia Sitemap Generation Completed"
          )
          print(
              "======================================"
          )
          print(
              f"Anime records: {total_anime}"
          )
          print(
              f"Anime sitemap files: "
              f"{len(anime_sitemap_files)}"
          )
          print(
              "Static sitemap: sitemap-pages.xml"
          )
          print(
              "Main sitemap: sitemap.xml"
          )
          print(
              "======================================"
          )

          PY


      # =====================================================
      # Validate sitemap XML
      # =====================================================

      - name: Validate sitemap
        run: |
          python3 - <<'PY'

          from pathlib import Path
          import xml.etree.ElementTree as ET


          sitemap_files = sorted(
              Path(".").glob(
                  "sitemap*.xml"
              )
          )


          if not sitemap_files:

              raise RuntimeError(
                  "No sitemap files were generated."
              )


          for sitemap_file in sitemap_files:

              print(
                  f"Validating: {sitemap_file}"
              )

              ET.parse(
                  sitemap_file
              )


          print("")
          print(
              f"Successfully validated "
              f"{len(sitemap_files)} sitemap files."
          )

          PY


      # =====================================================
      # Show generated files
      # =====================================================

      - name: Show sitemap files
        run: |
          echo "Generated sitemap files:"
          ls -lh sitemap*.xml


      # =====================================================
      # Commit and push
      # =====================================================

      - name: Commit and push sitemap
        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add -A sitemap*.xml


          if git diff --cached --quiet; then

            echo "No sitemap changes."

          else

            git commit \
              -m "chore: update sitemap.xml [skip ci]"

            git push origin HEAD:main

          fi
