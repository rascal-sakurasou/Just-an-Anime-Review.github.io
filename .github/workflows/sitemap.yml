name: Generate Sitemap

on:
push:
branches:
- main

schedule:
- cron: "0 * * * *"

workflow_dispatch:

permissions:
contents: write

jobs:
sitemap:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Generate sitemap
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    run: |
      python3 <<'PY'
      import os
      import json
      import urllib.request
      import urllib.parse
      import xml.etree.ElementTree as ET

      SUPABASE_URL = os.environ.get("SUPABASE_URL", "").rstrip("/")
      SUPABASE_KEY = os.environ.get("SUPABASE_KEY", "")

      if not SUPABASE_URL:
          raise RuntimeError("SUPABASE_URL is not configured.")

      if not SUPABASE_KEY:
          raise RuntimeError("SUPABASE_KEY is not configured.")

      BASE_URL = "https://media-mania.github.io/Animecia"

      headers = {
          "apikey": SUPABASE_KEY,
          "Authorization": f"Bearer {SUPABASE_KEY}",
          "Accept": "application/json"
      }

      api_url = (
          SUPABASE_URL
          + "/rest/v1/anime"
          + "?select=id"
          + "&order=id.asc"
      )

      request = urllib.request.Request(
          api_url,
          headers=headers
      )

      with urllib.request.urlopen(request, timeout=30) as response:
          data = json.load(response)

      if not isinstance(data, list):
          raise RuntimeError("Unexpected response from Supabase.")

      urls = [
          f"{BASE_URL}/",
          f"{BASE_URL}/anime.html"
      ]

      for anime in data:
          anime_id = anime.get("id")

          if anime_id is None:
              continue

          detail_url = (
              f"{BASE_URL}/anime-detail.html?id="
              + urllib.parse.quote(str(anime_id), safe="")
          )

          urls.append(detail_url)

      urls = list(dict.fromkeys(urls))

      urlset = ET.Element(
          "urlset",
          {
              "xmlns":
              "http://www.sitemaps.org/schemas/sitemap/0.9"
          }
      )

      for page_url in urls:
          url_element = ET.SubElement(urlset, "url")
          loc = ET.SubElement(url_element, "loc")
          loc.text = page_url

      tree = ET.ElementTree(urlset)

      ET.indent(tree, space="  ")

      tree.write(
          "sitemap.xml",
          encoding="utf-8",
          xml_declaration=True
      )

      print(f"Sitemap generated: {len(urls)} URLs")
      PY

  - name: Commit sitemap
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add sitemap.xml

      if git diff --cached --quiet; then
        echo "No changes to sitemap.xml"
        exit 0
      fi

      git commit -m "Update sitemap"
      git push
```
