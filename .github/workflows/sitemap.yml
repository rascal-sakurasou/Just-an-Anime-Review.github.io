name: Test Supabase Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Test Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          supabase_url = os.environ.get(
              "SUPABASE_URL",
              ""
          ).rstrip("/")

          supabase_key = os.environ.get(
              "SUPABASE_KEY",
              ""
          )

          print(
              "SUPABASE_URL configured:",
              bool(supabase_url)
          )

          print(
              "SUPABASE_KEY configured:",
              bool(supabase_key)
          )

          if not supabase_url:
              raise RuntimeError(
                  "SUPABASE_URL is missing."
              )

          if not supabase_key:
              raise RuntimeError(
                  "SUPABASE_KEY is missing."
              )

          api_url = (
              f"{supabase_url}/rest/v1/anime"
              "?select=id"
              "&limit=5"
          )

          print(
              "Testing:",
              f"{supabase_url}/rest/v1/anime"
          )

          request = urllib.request.Request(
              api_url,
              headers={
                  "apikey": supabase_key,
                  "Authorization":
                      f"Bearer {supabase_key}",
                  "Accept":
                      "application/json"
              }
          )

          try:

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  status = response.status

                  body = response.read().decode(
                      "utf-8"
                  )

                  print(
                      "HTTP status:",
                      status
                  )

                  data = json.loads(body)

                  print(
                      "Records returned:",
                      len(data)
                  )

                  print(
                      "Supabase REST API connection: OK"
                  )

          except urllib.error.HTTPError as error:

              print(
                  "HTTP status:",
                  error.code
              )

              body = error.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print(
                  "Response:",
                  body
              )

              raise

          except urllib.error.URLError as error:

              print(
                  "Connection error:",
                  error
              )

              raise

          PY
