name: Generate Sitemap

on:
  workflow_dispatch:
  schedule:
    # 毎日夜中に自動更新したい場合は以下を有効化（例: 毎日午前0時 UTC）
    # - cron: '0 0 * * *'
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate sitemap
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import xml.etree.ElementTree as ET

          supabase_url = os.environ.get("SUPABASE_URL", "").rstrip("/")
          supabase_key = os.environ.get("SUPABASE_KEY", "")

          if not supabase_url:
              raise RuntimeError("SUPABASE_URL is not configured.")

          if not supabase_key:
              raise RuntimeError("SUPABASE_KEY is not configured.")

          base_url = "https://media-mania.github.io/Animecia"

          api_url = f"{supabase_url}/rest/v1/anime?select=id&order=id.asc"

          request = urllib.request.Request(
              api_url,
              headers={
                  "apikey": supabase_key,
                  "Authorization": f"Bearer {supabase_key}",
                  "Accept": "application/json"
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              anime_list = json.load(response)

          urls = [
              f"{base_url}/",
              f"{base_url}/anime.html"
          ]

          for anime in anime_list:
              anime_id = anime.get("id")
              if anime_id is not None:
                  urls.append(f"{base_url}/anime-detail.html?id={anime_id}")

          # 重複を除去
          urls = list(dict.fromkeys(urls))

          urlset = ET.Element(
              "urlset",
              {"xmlns": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          )

          for page_url in urls:
              url_element = ET.SubElement(urlset, "url")
              loc = ET.SubElement(url_element, "loc")
              loc.text = page_url

          tree = ET.ElementTree(urlset)

          # ElementTreeのindent処理 (Python 3.9+)
          ET.indent(tree, space="  ")

          tree.write(
              "sitemap.xml",
              encoding="utf-8",
              xml_declaration=True
          )

          print(f"Sitemap generated: {len(urls)} URLs")
          PY

      - name: Commit and push sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sitemap.xml

          if git diff --cached --quiet; then
            echo "No changes detected in sitemap.xml"
          else
            git commit -m "chore: update sitemap.xml [skip ci]"
            git push origin HEAD:main
          fi
