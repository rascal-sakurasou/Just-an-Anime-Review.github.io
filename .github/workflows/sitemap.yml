steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Generate sitemap
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    run: |
      python3 - <<'PY'
      import os
      import json
      import urllib.request
      import xml.etree.ElementTree as ET

      supabase_url = os.environ["SUPABASE_URL"].rstrip("/")
      supabase_key = os.environ["SUPABASE_KEY"]

      base_url = "https://media-mania.github.io/Animecia"

      url = supabase_url + "/rest/v1/anime?select=id&order=id.asc"

      request = urllib.request.Request(
          url,
          headers={
              "apikey": supabase_key,
              "Authorization": "Bearer " + supabase_key
          }
      )

      with urllib.request.urlopen(request) as response:
          anime_list = json.load(response)

      urls = [
          base_url + "/",
          base_url + "/anime.html"
      ]

      for anime in anime_list:
          anime_id = anime.get("id")

          if anime_id is not None:
              urls.append(
                  base_url
                  + "/anime-detail.html?id="
                  + str(anime_id)
              )

      urlset = ET.Element(
          "urlset",
          {
              "xmlns": "http://www.sitemaps.org/schemas/sitemap/0.9"
          }
      )

      for page_url in urls:
          item = ET.SubElement(urlset, "url")
          loc = ET.SubElement(item, "loc")
          loc.text = page_url

      tree = ET.ElementTree(urlset)

      ET.indent(tree, space="  ")

      tree.write(
          "sitemap.xml",
          encoding="utf-8",
          xml_declaration=True
      )

      print("Sitemap generated:", len(urls), "URLs")
      PY

  - name: Commit sitemap
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add sitemap.xml

      if git diff --cached --quiet; then
        echo "No changes"
      else
        git commit -m "Update sitemap"
        git push
      fi
