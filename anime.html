    function escapeHTML(value) {

        if (
            value === null ||
            value === undefined
        ) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    function safeURL(value) {

        if (!value) {
            return "";
        }

        try {

            const url =
                new URL(
                    value,
                    window.location.href
                );

            if (
                url.protocol === "http:" ||
                url.protocol === "https:"
            ) {
                return url.href;
            }

        } catch (error) {
            return "";
        }

        return "";

    }


    function getMainTitle(anime) {

        return (
            anime.title_japanese ||
            anime.title_native ||
            anime.title_romaji ||
            anime.title_english ||
            anime.title ||
            "タイトル未設定"
        );

    }


    function getSubTitle(anime) {

        const main =
            getMainTitle(anime);

        const candidates = [
            anime.title_english,
            anime.title_romaji,
            anime.title_native,
            anime.title_japanese,
            anime.title
        ];

        for (const title of candidates) {

            if (
                title &&
                title !== main
            ) {
                return title;
            }

        }

        return "";

    }


    function getAnimeGenres(anime) {

        if (
            !anime ||
            !Array.isArray(
                anime.anime_genres
            )
        ) {
            return [];
        }

        return anime.anime_genres
            .map(item => item?.genres)
            .filter(Boolean)
            .map(genre => ({
                id: genre.id,
                name: genre.name
            }))
            .filter(
                genre => genre.name
            );

    }


    function formatStatus(status) {

        const map = {
            FINISHED: "放送終了",
            RELEASING: "放送中",
            NOT_YET_RELEASED: "放送前",
            CANCELLED: "中止",
            HIATUS: "休止中"
        };

        return map[status] || status || "";

    }


    function formatSeason(season) {

        const map = {
            WINTER: "冬",
            SPRING: "春",
            SUMMER: "夏",
            FALL: "秋"
        };

        return map[season] || season || "";

    }


    function formatFormat(format) {

        const map = {
            TV: "TV",
            TV_SHORT: "TVショート",
            MOVIE: "劇場版",
            OVA: "OVA",
            ONA: "ONA",
            SPECIAL: "特別編",
            MUSIC: "Music"
        };

        return map[format] || format || "";

    }


    function formatNumber(value) {

        if (
            value === null ||
            value === undefined ||
            value === ""
        ) {
            return "—";
        }

        const number =
            Number(value);

        if (Number.isNaN(number)) {
            return "—";
        }

        return number.toLocaleString("ja-JP");

    }


    function formatScore(value) {

        if (
            value === null ||
            value === undefined ||
            value === ""
        ) {
            return "—";
        }

        const number =
            Number(value);

        if (Number.isNaN(number)) {
            return "—";
        }

        return number.toFixed(1);

    }


    async function loadAnime() {

        animeGrid.innerHTML = `
            <div class="loading">
                アニメ情報を読み込んでいます……
            </div>
        `;

        resultCount.innerHTML =
            "<span>0</span> 作品";


        try {

            const {
                data,
                error
            } = await supabaseClient
                .from("anime")
                .select(`
                    id,
                    title,
                    title_romaji,
                    title_english,
                    title_native,
                    title_japanese,
                    description,
                    cover_image,
                    banner_image,
                    start_date,
                    end_date,
                    episodes,
                    duration,
                    status,
                    format,
                    season,
                    season_year,
                    source,
                    average_score,
                    popularity,
                    favourites_count,
                    site_url,
                    updated_at,
                    anime_genres (
                        genres (
                            id,
                            name
                        )
                    )
                `)
                .order(
                    "popularity",
                    {
                        ascending: false,
                        nullsFirst: false
                    }
                );


            if (error) {
                throw error;
            }


            animeData =
                Array.isArray(data)
                    ? data
                    : [];


            createYearOptions();
            createGenreOptions();


            if (animeData.length === 0) {

                showEmptyDatabase();

                return;

            }


            applyFilters();


        } catch (error) {

            console.error(
                "Anime loading error:",
                error
            );

            showLoadError(error);

        }

    }


    function showEmptyDatabase() {

        resultCount.innerHTML =
            "<span>0</span> 作品";


        animeGrid.innerHTML = `
            <div class="empty-state">

                <h2>
                    登録されているアニメはありません
                </h2>

                <p>
                    現在、Animeciaのデータベースに
                    アニメ作品が登録されていません。
                </p>

            </div>
        `;

    }


    function showLoadError(error) {

        resultCount.innerHTML =
            "<span>0</span> 作品";


        const message =
            error?.message ||
            error?.details ||
            "Supabaseとの接続に失敗しました。";


        animeGrid.innerHTML = `
            <div class="error-state">

                <h2>
                    アニメ情報を読み込めませんでした
                </h2>

                <p>
                    Supabaseとの接続または
                    データベース設定を確認してください。
                </p>

                <p class="error-detail">
                    ${escapeHTML(message)}
                </p>

            </div>
        `;

    }


    function createYearOptions() {

        const years =
            new Set();


        animeData.forEach(anime => {

            if (anime.season_year) {

                years.add(
                    Number(
                        anime.season_year
                    )
                );

                return;

            }


            if (anime.start_date) {

                const year =
                    new Date(
                        anime.start_date
                    ).getFullYear();


                if (
                    !Number.isNaN(year)
                ) {
                    years.add(year);
                }

            }

        });


        const sortedYears =
            [...years].sort(
                (a, b) => b - a
            );


        yearFilter.innerHTML = `
            <option value="">
                すべて
            </option>
        `;


        sortedYears.forEach(year => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                String(year);

            option.textContent =
                `${year}年`;

            yearFilter.appendChild(
                option
            );

        });

    }


    function createGenreOptions() {

        const genreMap =
            new Map();


        animeData.forEach(anime => {

            const genres =
                getAnimeGenres(anime);


            genres.forEach(genre => {

                if (
                    genre.id !== null &&
                    genre.id !== undefined &&
                    genre.name
                ) {

                    genreMap.set(
                        String(genre.id),
                        genre.name
                    );

                }

            });

        });


        const sortedGenres =
            [...genreMap.entries()]
                .sort(
                    (a, b) =>
                        String(a[1])
                            .localeCompare(
                                String(b[1]),
                                "ja"
                            )
                );


        genreFilter.innerHTML = `
            <option value="">
                すべて
            </option>
        `;


        sortedGenres.forEach(
            ([id, name]) => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value = id;
                option.textContent = name;

                genreFilter.appendChild(
                    option
                );

            }
        );

    }


    function applyFilters() {

        const keyword =
            searchInput.value
                .trim()
                .toLowerCase();


        const year =
            yearFilter.value;

        const season =
            seasonFilter.value;

        const status =
            statusFilter.value;

        const format =
            formatFilter.value;

        const genre =
            genreFilter.value;

        const sort =
            sortFilter.value;


        filteredAnime =
            animeData.filter(anime => {

                if (keyword) {

                    const searchableText = [

                        anime.title,
                        anime.title_romaji,
                        anime.title_english,
                        anime.title_native,
                        anime.title_japanese,
                        anime.description,
                        anime.source,

                        ...getAnimeGenres(
                            anime
                        ).map(
                            item => item.name
                        )

                    ]
                        .filter(Boolean)
                        .join(" ")
                        .toLowerCase();


                    if (
                        !searchableText.includes(
                            keyword
                        )
                    ) {
                        return false;
                    }

                }


                if (year) {

                    const animeYear =
                        anime.season_year
                            ? String(
                                anime.season_year
                            )
                            : (
                                anime.start_date
                                    ? String(
                                        new Date(
                                            anime.start_date
                                        ).getFullYear()
                                    )
                                    : ""
                            );


                    if (
                        animeYear !== year
                    ) {
                        return false;
                    }

                }


                if (
                    season &&
                    anime.season !== season
                ) {
                    return false;
                }


                if (
                    status &&
                    anime.status !== status
                ) {
                    return false;
                }


                if (
                    format &&
                    anime.format !== format
                ) {
                    return false;
                }


                if (genre) {

                    const hasGenre =
                        getAnimeGenres(
                            anime
                        ).some(
                            item =>
                                String(
                                    item.id
                                ) ===
                                String(
                                    genre
                                )
                        );


                    if (!hasGenre) {
                        return false;
                    }

                }


                return true;

            });


        filteredAnime.sort(
            (a, b) => {

                switch (sort) {

                    case "score":

                        return (
                            Number(
                                b.average_score || 0
                            ) -
                            Number(
                                a.average_score || 0
                            )
                        );


                    case "popularity":

                        return (
                            Number(
                                b.popularity || 0
                            ) -
                            Number(
                                a.popularity || 0
                            )
                        );


                    case "newest":

                        return (
                            new Date(
                                b.start_date ||
                                "1900-01-01"
                            ) -
                            new Date(
                                a.start_date ||
                                "1900-01-01"
                            )
                        );


                    case "title":

                        return getMainTitle(a)
                            .localeCompare(
                                getMainTitle(b),
                                "ja"
                            );


                    case "default":
                    default:

                        return (
                            Number(
                                b.popularity || 0
                            ) -
                            Number(
                                a.popularity || 0
                            )
                        );

                }

            }
        );


        renderAnime();

    }


    function renderAnime() {

        resultCount.innerHTML =
            `<span>${formatNumber(
                filteredAnime.length
            )}</span> 作品`;


        if (
            filteredAnime.length === 0
        ) {

            animeGrid.innerHTML = `
                <div class="empty-state">

                    <h2>
                        アニメが見つかりませんでした
                    </h2>

                    <p>
                        検索条件やフィルターを
                        変更してみてください。
                    </p>

                </div>
            `;

            return;

        }


        animeGrid.innerHTML =
            filteredAnime
                .map(
                    anime =>
                        createAnimeCard(
                            anime
                        )
                )
                .join("");

    }


    function createAnimeCard(anime) {

        const title =
            getMainTitle(anime);

        const subTitle =
            getSubTitle(anime);

        const genres =
            getAnimeGenres(anime);


        const coverImage =
            safeURL(
                anime.cover_image
            );


        const detailURL =
            `anime-detail.html?id=${
                encodeURIComponent(
                    anime.id
                )
            }`;


        let tagsHTML = "";


        const statusText =
            formatStatus(
                anime.status
            );


        if (statusText) {

            tagsHTML += `
                <span class="meta-tag">
                    ${escapeHTML(statusText)}
                </span>
            `;

        }


        const formatText =
            formatFormat(
                anime.format
            );


        if (formatText) {

            tagsHTML += `
                <span class="meta-tag">
                    ${escapeHTML(formatText)}
                </span>
            `;

        }


        if (anime.season_year) {

            tagsHTML += `
                <span class="meta-tag">
                    ${escapeHTML(
                        anime.season_year
                    )}年
                </span>
            `;

        }


        const seasonText =
            formatSeason(
                anime.season
            );


        if (seasonText) {

            tagsHTML += `
                <span class="meta-tag">
                    ${escapeHTML(seasonText)}
                </span>
            `;

        }


        genres
            .slice(0, 4)
            .forEach(genre => {

                tagsHTML += `
                    <span class="meta-tag genre-tag">
                        ${escapeHTML(
                            genre.name
                        )}
                    </span>
                `;

            });


        const description =
            anime.description
                ? anime.description
                : "作品情報は準備中です。";


        const imageHTML =
            coverImage

                ? `
                    <img
                        src="${escapeHTML(
                            coverImage
                        )}"
                        alt="${escapeHTML(
                            title
                        )}のキービジュアル"
                        loading="lazy"
                        onerror="
                            this.style.display='none';
                            this.nextElementSibling.style.display='flex';
                        "
                    >

                    <div
                        class="image-placeholder"
                        style="display:none;"
                    >
                        画像なし
                    </div>
                `

                : `
                    <div class="image-placeholder">
                        画像なし
                    </div>
                `;


        const scoreHTML =
            anime.average_score !== null &&
            anime.average_score !== undefined
                ? `
                    <div class="score-badge">
                        ★
                        ${escapeHTML(
                            formatScore(
                                anime.average_score
                            )
                        )}
                    </div>
                `
                : "";


        return `
            <article class="anime-card">

                <div class="anime-card-image">

                    ${imageHTML}

                    ${scoreHTML}

                </div>


                <div class="anime-card-body">

                    <h2 class="anime-card-title">

                        <a
                            href="${detailURL}"
                        >
                            ${escapeHTML(title)}
                        </a>

                    </h2>


                    ${
                        subTitle
                            ? `
                                <p
                                    class="anime-card-subtitle"
                                >
                                    ${escapeHTML(
                                        subTitle
                                    )}
                                </p>
                            `
                            : ""
                    }


                    <div class="meta-tags">
                        ${tagsHTML}
                    </div>


                    <p class="anime-description">
                        ${escapeHTML(
                            description
                        )}
                    </p>


                    <div class="anime-stats">

                        <div class="anime-stat">

                            <span
                                class="anime-stat-label"
                            >
                                評価
                            </span>

                            <span
                                class="anime-stat-value"
                            >
                                ${
                                    anime.average_score !== null &&
                                    anime.average_score !== undefined
                                        ? `★ ${escapeHTML(
                                            formatScore(
                                                anime.average_score
                                            )
                                        )}`
                                        : "—"
                                }
                            </span>

                        </div>


                        <div class="anime-stat">

                            <span
                                class="anime-stat-label"
                            >
                                人気度
                            </span>

                            <span
                                class="anime-stat-value"
                            >
                                ${escapeHTML(
                                    formatNumber(
                                        anime.popularity
                                    )
                                )}
                            </span>

                        </div>

                    </div>


                    <a
                        class="detail-link"
                        href="${detailURL}"
                    >
                        詳細を見る
                    </a>

                </div>

            </article>
        `;

    }


    function resetFilters() {

        searchInput.value = "";

        yearFilter.value = "";

        seasonFilter.value = "";

        statusFilter.value = "";

        formatFilter.value = "";

        genreFilter.value = "";

        sortFilter.value =
            "default";


        applyFilters();

    }


    searchButton.addEventListener(
        "click",
        applyFilters
    );


    searchInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter"
            ) {
                applyFilters();
            }

        }
    );


    yearFilter.addEventListener(
        "change",
        applyFilters
    );


    seasonFilter.addEventListener(
        "change",
        applyFilters
    );


    statusFilter.addEventListener(
        "change",
        applyFilters
    );


    formatFilter.addEventListener(
        "change",
        applyFilters
    );


    genreFilter.addEventListener(
        "change",
        applyFilters
    );


    sortFilter.addEventListener(
        "change",
        applyFilters
    );


    resetButton.addEventListener(
        "click",
        resetFilters
    );


    loadAnime();
</script>
