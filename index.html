<script>

/* =========================================================
   Supabase設定
========================================================= */

const SUPABASE_URL =
"https://bhgdjuwlxvbaeraaivmh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   共通
========================================================= */

const $ = id =>
document.getElementById(id);


function escapeHTML(text) {

const div =
document.createElement("div");

div.textContent =
text ?? "";

return div.innerHTML;

}


function isSafeURL(url) {

try {

const u =
new URL(url);

return (
u.protocol === "http:" ||
u.protocol === "https:"
);

} catch {

return false;

}

}


function getTodayString() {

return new Date()
.toISOString()
.slice(0,10);

}


function getCurrentTimeString() {

return new Date()
.toTimeString()
.slice(0,5);

}


function isDateInPeriod(
current,
start,
end
) {

return (
current >= (start || "0000-01-01") &&
current <= (end || "9999-12-31")
);

}


function isTimeInPeriod(
current,
start,
end
) {

start =
String(start || "00:00")
.slice(0,5);

end =
String(end || "23:59")
.slice(0,5);


if (start === end) {

return current === start;

}


if (start < end) {

return (
current >= start &&
current <= end
);

}


return (
current >= start ||
current <= end
);

}


function formatDate(date) {

if (!date) return "";

const p =
String(date).split("-");

if (p.length !== 3) {

return date;

}

return `${p[0]}年${p[1]}月${p[2]}日`;

}


function formatTime(time) {

if (!time) return "";

return String(time).slice(0,5);

}


/* =========================================================
   Auth
========================================================= */

let authMode =
"login";


function openAuth(
mode = "login"
) {

authMode = mode;

$("auth-modal")
.classList.add("is-open");

$("auth-modal")
.setAttribute(
  "aria-hidden",
  "false"
);


$("auth-modal-title")
.textContent =
mode === "signup"
  ? "Animeciaに新規登録"
  : "Animeciaにログイン";


$("auth-description")
.textContent =
mode === "signup"
  ? "アカウントを作成してお気に入りや視聴状況を保存できます。"
  : "お気に入りや視聴状況を保存できます。";


$("auth-submit")
.textContent =
mode === "signup"
  ? "新規登録"
  : "ログイン";


$("auth-switch")
.textContent =
mode === "signup"
  ? "ログインはこちら"
  : "新規登録はこちら";


$("auth-display-name-wrap")
.hidden =
mode !== "signup";


$("auth-message")
.textContent = "";

}


function closeAuth() {

$("auth-modal")
.classList.remove("is-open");

$("auth-modal")
.setAttribute(
  "aria-hidden",
  "true"
);

}


/* =========================================================
   ログイン状態UI
========================================================= */

async function updateAuthUI(user) {

const button =
$("auth-button");

const menu =
$("user-menu");

const box =
$("profile-box");


if (user) {

let displayName =
user.user_metadata?.display_name ||
"Animecia User";


const {
data: profile
} =
await supabaseClient
.from("profiles")
.select("display_name")
.eq("id",user.id)
.maybeSingle();


if (
profile?.display_name
) {

displayName =
profile.display_name;

}


menu.textContent =
displayName;

menu.classList.add(
"is-open"
);


button.textContent =
"アカウント";


box.classList.add(
"is-open"
);


$("profile-name")
.textContent =
displayName;


$("profile-email")
.textContent =
user.email || "";


button.onclick = () => {

box.scrollIntoView({
behavior:"smooth",
block:"center"
});

};


} else {

menu.classList.remove(
"is-open"
);

button.textContent =
"ログイン";

box.classList.remove(
"is-open"
);


button.onclick = () =>
openAuth("login");

}

}


/* =========================================================
   新規登録・ログイン
========================================================= */

async function handleAuthSubmit(e) {

e.preventDefault();


const email =
$("auth-email")
.value
.trim();

const password =
$("auth-password")
.value;

const displayName =
$("auth-display-name")
.value
.trim();

const message =
$("auth-message");

const submit =
$("auth-submit");


message.textContent = "";

submit.disabled = true;


try {


/* =======================================================
   新規登録
======================================================= */

if (
authMode === "signup"
) {

const {
data,
error
} =
await supabaseClient.auth.signUp({

email,

password,

options: {

data: {

display_name:
displayName ||
"Animecia User"

}

}

});


if (error) {

throw error;

}


if (data.user) {

if (data.session) {

message.textContent =
"登録しました。";

await updateAuthUI(
data.user
);

setTimeout(
closeAuth,
500
);

} else {

message.textContent =
"確認メールを確認してください。";

}

}


/* =======================================================
   ログイン
======================================================= */

} else {

const {
data,
error
} =
await supabaseClient.auth.signInWithPassword({

email,

password

});


if (error) {

throw error;

}


await updateAuthUI(
data.user
);

closeAuth();

}


} catch (error) {

console.error(
"認証エラー:",
error
);

message.textContent =
error?.message ||
"認証に失敗しました。";


} finally {

submit.disabled = false;

}

}


/* =========================================================
   ログアウト
========================================================= */

async function logout() {

const {
error
} =
await supabaseClient.auth.signOut();


if (error) {

alert(error.message);

return;

}


await updateAuthUI(null);

}


/* =========================================================
   Auth初期化
========================================================= */

async function initAuth() {

const {
data: {
session
}
} =
await supabaseClient.auth.getSession();


await updateAuthUI(
session?.user || null
);


supabaseClient.auth.onAuthStateChange(
async (_event,session) => {

await updateAuthUI(
session?.user || null
);

});

}


/* =========================================================
   おすすめアニメ
========================================================= */

async function loadRecommendations() {

const container =
$("recommendation-list");

const periodText =
$("recommendation-period");


container.innerHTML =
'<div class="recommendation-empty">おすすめアニメを読み込み中……</div>';


try {


const currentDate =
getTodayString();

const currentTime =
getCurrentTimeString();


/* =======================================================
   おすすめ設定
======================================================= */

const {
data: settings,
error: settingsError
} =
await supabaseClient
.from("recommended_anime")
.select(`
id,
anime_id,
start_date,
end_date,
start_time,
end_time,
display_order,
is_active
`)
.eq(
"is_active",
true
)
.order(
"display_order",
{
ascending:true
}
)
.order(
"id",
{
ascending:true
}
);


if (settingsError) {

throw settingsError;

}


if (
!settings ||
settings.length === 0
) {

container.innerHTML =
'<div class="recommendation-empty">現在、おすすめアニメは設定されていません。</div>';

return;

}


/* =======================================================
   現在有効なおすすめ
======================================================= */

const active =
settings.filter(
item => {

return (
isDateInPeriod(
currentDate,
item.start_date,
item.end_date
)
&&
isTimeInPeriod(
currentTime,
item.start_time,
item.end_time
)
);

});


if (
active.length === 0
) {

container.innerHTML =
'<div class="recommendation-empty">現在、この期間のおすすめアニメは設定されていません。</div>';

return;

}


/* =======================================================
   表示期間
======================================================= */

const first =
active[0];

let period = [];


if (
first.start_date &&
first.end_date
) {

period.push(
`${formatDate(first.start_date)} ～ ${formatDate(first.end_date)}`
);

} else if (
first.start_date
) {

period.push(
`${formatDate(first.start_date)} ～`
);

} else if (
first.end_date
) {

period.push(
`～ ${formatDate(first.end_date)}`
);

}


if (
first.start_time &&
first.end_time
) {

period.push(
`${formatTime(first.start_time)} ～ ${formatTime(first.end_time)}`
);

}


periodText.textContent =
period.join(" / ");


/* =======================================================
   アニメID
======================================================= */

const ids =
active
.map(
item => item.anime_id
)
.filter(
id =>
id !== null &&
id !== undefined &&
id !== ""
);


if (!ids.length) {

container.innerHTML =
'<div class="recommendation-empty">現在、おすすめアニメは設定されていません。</div>';

return;

}


/* =======================================================
   アニメ取得
======================================================= */

const {
data: animeData,
error: animeError
} =
await supabaseClient
.from("anime")
.select(`
id,
title,
title_romaji,
title_english,
title_native,
title_japanese,
description
`)
.in(
"id",
ids
);


if (animeError) {

throw animeError;

}


const animeMap =
new Map(
(animeData || [])
.map(
anime => [
String(anime.id),
anime
]
)
);


/* =======================================================
   表示順を維持
======================================================= */

const uniqueAnime = [];

const usedIds =
new Set();


for (
const setting of active
) {

const anime =
animeMap.get(
String(setting.anime_id)
);


if (
!anime
) {

continue;

}


const id =
String(anime.id);


if (
usedIds.has(id)
) {

continue;

}


usedIds.add(id);

uniqueAnime.push(
anime
);

}


/* =======================================================
   表示
======================================================= */

if (
uniqueAnime.length === 0
) {

container.innerHTML =
'<div class="recommendation-empty">現在、おすすめアニメを設定できる作品がありません。</div>';

return;

}


container.innerHTML = "";


uniqueAnime.forEach(
(anime,index) => {

const card =
document.createElement(
"article"
);


card.className =
"recommendation-card";


const link =
document.createElement(
"a"
);


link.href =
"anime-detail.html?id=" +
encodeURIComponent(
anime.id
);


const number =
document.createElement(
"div"
);


number.className =
"recommendation-number";


number.textContent =
`RECOMMENDATION ${index + 1}`;


const title =
document.createElement(
"h3"
);


title.textContent =
anime.title ||
anime.title_native ||
anime.title_romaji ||
"無題";


link.appendChild(
number
);

link.appendChild(
title
);


/* 英語・ローマ字タイトル */

const english =
anime.title_english ||
anime.title_romaji;


if (english) {

const englishElement =
document.createElement(
"div"
);

englishElement.className =
"recommendation-english";

englishElement.textContent =
english;

link.appendChild(
englishElement
);

}


/* あらすじ */

if (
anime.description
) {

const description =
document.createElement(
"div"
);

description.className =
"recommendation-description";

description.textContent =
anime.description;

link.appendChild(
description
);

}


card.appendChild(
link
);

container.appendChild(
card
);

});

} catch (error) {

console.error(
"おすすめアニメ読み込みエラー:",
error
);

container.innerHTML =
'<div class="recommendation-empty">おすすめアニメを表示できませんでした。</div>';

}

}


/* =========================================================
   広告
========================================================= */

async function loadAdvertisement() {

const section =
$("ad-section");

const container =
$("ad-container");


try {

const {
data,
error
} =
await supabaseClient
.from("advertisements")
.select(`
id,
company_name,
title,
description,
image_url,
link_url
`)
.eq(
"is_active",
true
)
.order(
"id",
{
ascending:true
}
)
.limit(1);


if (
error ||
!data ||
data.length === 0
) {

return;

}


const ad =
data[0];

let html = "";


/* 画像 */

if (
ad.image_url &&
isSafeURL(
ad.image_url
)
) {

html += `
<img
src="${escapeHTML(ad.image_url)}"
alt="${escapeHTML(ad.title || "広告")}"
loading="lazy"
onerror="this.style.display='none'">
`;

}


/* 企業名 */

if (
ad.company_name
) {

html += `
<div class="ad-company">
${escapeHTML(ad.company_name)}
</div>
`;

}


/* タイトル */

if (
ad.title
) {

html += `
<div class="ad-title">
${escapeHTML(ad.title)}
</div>
`;

}


/* 説明 */

if (
ad.description
) {

html += `
<div class="ad-description">
${escapeHTML(ad.description)}
</div>
`;

}


/* リンク */

if (
ad.link_url &&
isSafeURL(
ad.link_url
)
) {

html += `
<a
class="ad-button"
href="${escapeHTML(ad.link_url)}"
target="_blank"
rel="noopener noreferrer nofollow">
詳しくはこちら
</a>
`;

}


if (
!html.trim()
) {

return;

}


container.innerHTML =
html;

section.style.display =
"block";


} catch (error) {

console.error(
"広告読み込みエラー:",
error
);

}

}


/* =========================================================
   起動
========================================================= */

document.addEventListener(
"DOMContentLoaded",
() => {


initAuth();

loadRecommendations();

loadAdvertisement();


$("auth-button")
.addEventListener(
"click",
() => {

openAuth("login");

});


$("auth-close")
.addEventListener(
"click",
closeAuth
);


document
.querySelector(
"[data-auth-close]"
)
.addEventListener(
"click",
closeAuth
);


$("auth-switch")
.addEventListener(
"click",
() => {

openAuth(
authMode === "login"
? "signup"
: "login"
);

});


$("auth-form")
.addEventListener(
"submit",
handleAuthSubmit
);


$("logout-button")
.addEventListener(
"click",
logout
);


document.addEventListener(
"keydown",
event => {

if (
event.key === "Escape"
) {

closeAuth();

}

});

});

</script>

</body>
</html>
