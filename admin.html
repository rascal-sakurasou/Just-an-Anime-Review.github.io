}

/* =========================

========================= */

button {

<div class="login-icon">

<h1>

</h1>

<p class="description">

<script>

/* =========================================
   Supabase設定
========================================= */

const SUPABASE_URL =
  "https://bhgdjuwlxvbaeraaivmh.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_-rZ4HusVezs5IlZQnUQ-Kw_SLUd8R0c";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   DOM
========================================= */

const loginForm =
  document.getElementById("login-form");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginButton =
  document.getElementById("login-button");

const message =
  document.getElementById("message");


/* =========================================
   メッセージ表示
========================================= */

function setMessage(
  text,
  type = ""
) {

  message.textContent = text;

  message.className =
    "message" +
    (type ? " " + type : "");

}


/* =========================================
   既存セッション確認
========================================= */

async function checkExistingSession() {

  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();


    if (error) {

      console.error(
        "Session error:",
        error
      );

      return;

    }


    if (data && data.session) {

      window.location.replace(
        "admin-dashboard.html"
      );

    }

  } catch (error) {

    console.error(
      "Session check failed:",
      error
    );

  }

}


/* =========================================
   ログイン
========================================= */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;


    if (!email || !password) {

      setMessage(
        "メールアドレスとパスワードを入力してください。",
        "error"
      );

      return;

    }


    loginButton.disabled = true;

    setMessage(
      "ログインしています……",
      "loading"
    );


    try {

      const {
        data,
        error
      } =
        await supabaseClient.auth
          .signInWithPassword({

            email: email,

            password: password

          });


      if (error) {

        console.error(
          "Login error:",
          error
        );

        setMessage(
          "メールアドレスまたはパスワードが正しくありません。",
          "error"
        );

        loginButton.disabled = false;

        return;

      }


      if (!data || !data.session) {

        setMessage(
          "ログインセッションを確認できませんでした。",
          "error"
        );

        loginButton.disabled = false;

        return;

      }


      setMessage(
        "ログインしました。管理画面へ移動します。",
        "success"
      );


      window.location.replace(
        "admin-dashboard.html"
      );

    } catch (error) {

      console.error(
        "Unexpected login error:",
        error
      );

      setMessage(
        "ログイン中にエラーが発生しました。時間をおいて再度お試しください。",
        "error"
      );

      loginButton.disabled = false;

    }

  }
);


/* =========================================
   Enterキーなどによる多重送信対策
========================================= */

loginForm.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      loginButton.disabled
    ) {

      event.preventDefault();

    }

  }
);


/* =========================================
   起動
========================================= */

checkExistingSession();

</script>
